
{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h2>Thêm tài khoản nhân viên</h2>

    <form method="POST"
          action="{{ url_for('admin.employee_add') }}"
          class="mt-3"
          style="max-width: 600px;">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <div class="mb-3">
            <label for="full_name" class="form-label">Họ và tên</label>
            <input type="text"
                   class="form-control"
                   id="full_name"
                   name="full_name"
                   maxlength="150"
                   required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email đăng nhập</label>
            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   maxlength="150"
                   required>
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">Số điện thoại</label>
            <input type="tel"
                   class="form-control"
                   id="phone"
                   name="phone"
                   maxlength="20">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">
                Mật khẩu ban đầu
            </label>
            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   minlength="8"
                   autocomplete="new-password"
                   required>
            <div class="form-text">
                Mật khẩu phải có ít nhất 8 ký tự.
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            Tạo nhân viên
        </button>

        <a href="{{ url_for('admin.dashboard') }}"
           class="btn btn-secondary">
            ← Trang quản trị
        </a>

        <a href="{{ url_for('admin.employee_list') }}"
           class="btn btn-outline-secondary">
            Danh sách nhân viên
        </a>
    </form>
</div>
{% endblock %}
