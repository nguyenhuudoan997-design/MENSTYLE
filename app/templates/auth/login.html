<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | MENSTYLE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            background: #f5f5f5;
            color: #171717;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            margin: 40px auto;
            padding: 32px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #666;
            text-align: center;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #333;
            outline-offset: 1px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #171717;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .message {
            margin: 12px 0;
            padding: 12px;
            border-radius: 6px;
            background: #f0f0f0;
        }

        .links {
            margin-top: 20px;
            text-align: center;
            line-height: 1.8;
        }

        a {
            color: #171717;
        }
    </style>
</head>

<body>
    <main class="login-box">
        <h1>MENSTYLE</h1>
        <p class="subtitle">Đăng nhập tài khoản của bạn</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message" role="status">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}
     
        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
            >

            <label for="password">Mật khẩu</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">ĐĂNG NHẬP</button>
        </form>

        <div class="links">
            Chưa có tài khoản?
            <a href="{{ url_for('auth.register') }}">Đăng ký ngay</a>
            <br>
            <a href="{{ url_for('main.home') }}">Quay lại trang chủ</a>
        </div>
    </main>
</body>
</html>
